# Render Blueprint for the Job Checklist dashboard (Checklist folder). It now runs on Alcove Deploy instead
# (see Checklist/README.md). Run only one server against the checklist workbook at a time.
# Values marked sync: false are asked for when the Blueprint is created; they never go into GitHub.
services:
  - type: web
    name: job-checklist-dashboard
    runtime: node
    plan: free
    rootDir: Checklist
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: CHECKLIST_FILE_ID
        value: 1bmgjKdSf6zITxFC6A6omZLQ6pdMi0oma
      - key: GOOGLE_CLIENT_EMAIL
        value: company-master-dashboard@company-master-dashboard.iam.gserviceaccount.com
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
